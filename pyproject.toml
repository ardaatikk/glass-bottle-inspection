[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-bottle-inspection"
version = "0.1.0"
description = "Explainable computer vision pipeline for geometric glass bottle defect inspection."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]